<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fiber Route Diagnostics Dashboard</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #080c14;
      --card-bg: rgba(17, 24, 39, 0.5);
      --card-border: rgba(255, 255, 255, 0.06);
      --card-hover-border: rgba(255, 255, 255, 0.12);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --primary: #8b5cf6;
      --primary-glow: rgba(139, 92, 246, 0.15);
      
      --success: #10b981;
      --success-glow: rgba(16, 185, 129, 0.1);
      --error: #ef4444;
      --error-glow: rgba(239, 68, 68, 0.1);
      --pending: #f59e0b;
      --pending-glow: rgba(245, 158, 11, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      overflow-hidden: auto;
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Ambient Background Glow Orbs */
    body::before, body::after {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--primary) 0%, transparent 70%);
      opacity: 0.15;
      filter: blur(80px);
      z-index: -1;
      pointer-events: none;
    }
    body::before {
      top: -10%;
      left: 10%;
    }
    body::after {
      bottom: -10%;
      right: 10%;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem 2rem;
      border-bottom: 1px solid var(--card-border);
      background: rgba(8, 12, 20, 0.8);
      backdrop-filter: blur(12px);
      z-index: 10;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo-mark {
      width: 24px;
      height: 24px;
      background: linear-gradient(135deg, #a78bfa, #8b5cf6);
      border-radius: 6px;
      box-shadow: 0 0 12px var(--primary);
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.875rem;
      background: rgba(255, 255, 255, 0.04);
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      border: 1px solid var(--card-border);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--error);
      box-shadow: 0 0 8px var(--error);
    }

    .status-dot.connected {
      background-color: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .dashboard-layout {
      flex: 1;
      display: grid;
      grid-template-columns: 380px 1fr;
      overflow: hidden;
    }

    /* Payments Feed Panel */
    .feed-panel {
      border-right: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      background: rgba(10, 15, 26, 0.3);
    }

    .search-bar-container {
      padding: 1rem;
      border-bottom: 1px solid var(--card-border);
    }

    .search-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--text-main);
      padding: 0.6rem 0.8rem;
      font-size: 0.875rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px var(--primary-glow);
    }

    .payments-list {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .payment-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .payment-card:hover {
      border-color: var(--card-hover-border);
      transform: translateY(-1px);
    }

    .payment-card.active {
      border-color: var(--primary);
      background: rgba(139, 92, 246, 0.03);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .amount-text {
      font-size: 1rem;
      font-weight: 700;
    }

    .status-pill {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.15rem 0.5rem;
      border-radius: 6px;
      text-transform: uppercase;
    }

    .status-pill.success {
      background-color: var(--success-glow);
      color: var(--success);
    }

    .status-pill.failed {
      background-color: var(--error-glow);
      color: var(--error);
    }

    .status-pill.pending {
      background-color: var(--pending-glow);
      color: var(--pending);
      animation: pulse-glow 2s infinite;
    }

    @keyframes pulse-glow {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .hash-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .timestamp-text {
      font-size: 0.75rem;
      color: var(--text-muted);
      align-self: flex-end;
    }

    /* Diagnostics Details Panel */
    .details-panel {
      overflow-y: auto;
      padding: 2.5rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .placeholder-view {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      gap: 1rem;
    }

    .placeholder-icon {
      font-size: 3rem;
      opacity: 0.3;
    }

    .section-title {
      font-size: 0.875rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
    }

    .summary-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.25rem;
    }

    .summary-val {
      font-size: 1.5rem;
      font-weight: 800;
      margin-top: 0.25rem;
    }

    /* Visual Graph Hops Component */
    .route-visualizer {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .hops-chain {
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      padding: 1rem 0;
    }

    .hops-chain::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 10%;
      right: 10%;
      height: 2px;
      background: rgba(255, 255, 255, 0.08);
      z-index: 1;
      transform: translateY(-50%);
    }

    .hop-node {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      z-index: 2;
      width: 140px;
    }

    .node-circle {
      min-width: 90px;
      padding: 0 12px;
      height: 32px;
      border-radius: 9999px;
      background: #111827;
      border: 2px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.75rem;
      transition: all 0.3s ease;
      white-space: nowrap;
    }

    .hop-node.success .node-circle {
      border-color: var(--success);
      color: var(--success);
      box-shadow: 0 0 12px var(--success-glow);
    }

    .hop-node.failed .node-circle {
      border-color: var(--error);
      color: var(--error);
      box-shadow: 0 0 12px var(--error-glow);
    }

    .hop-node.untracked .node-circle {
      border-color: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
    }

    .node-pubkey {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      color: var(--text-muted);
      max-width: 100px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Diagnostics Suggestion Card */
    .diagnostic-card {
      border-radius: 16px;
      border: 1px dashed rgba(239, 68, 68, 0.3);
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.04) 0%, rgba(245, 158, 11, 0.01) 100%);
      padding: 1.75rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .diag-title-section {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .warning-icon {
      font-size: 1.25rem;
      color: var(--error);
    }

    .diag-code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .diag-suggestion {
      font-size: 0.9375rem;
      line-height: 1.6;
      color: #cbd5e1;
    }

    /* Logs view */
    .logs-card {
      background: #090e17;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .raw-error-console {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8125rem;
      color: #f87171;
      background: #030712;
      padding: 1rem;
      border-radius: 8px;
      white-space: pre-wrap;
      word-break: break-all;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    .invoice-console {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: #030712;
      padding: 0.75rem;
      border-radius: 6px;
      word-break: break-all;
      border: 1px solid rgba(255, 255, 255, 0.02);
    }

    .copy-btn {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 0.35rem 0.75rem;
      font-size: 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .copy-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--card-hover-border);
    }

    /* ── Statistics Panel ────────────────────────────────── */
    .stats-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .stats-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 0.875rem 1rem;
    }

    .stat-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 0.3rem;
    }

    .stat-value {
      font-size: 1.25rem;
      font-weight: 800;
    }

    .stat-value.success { color: var(--success); }
    .stat-value.error   { color: var(--error); }
    .stat-value.muted   { color: var(--text-muted); }

    .error-codes-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .error-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      padding: 0.2rem 0.5rem;
      border-radius: 5px;
      background: var(--error-glow);
      color: var(--error);
      border: 1px solid rgba(239, 68, 68, 0.2);
    }

    .error-badge-count {
      opacity: 0.7;
      margin-left: 0.25rem;
    }

    /* ── Test Route panel ───────────────────────────────── */
    .test-route-bar {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .test-route-actions {
      display: flex;
      gap: 0.5rem;
    }

    .test-route-input {
      flex: 1;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--text-main);
      padding: 0.5rem 0.75rem;
      font-size: 0.8rem;
      outline: none;
      font-family: 'JetBrains Mono', monospace;
      transition: border-color 0.2s;
    }

    .test-route-input:focus {
      border-color: var(--primary);
    }

    .test-route-btn {
      background: var(--primary-glow);
      border: 1px solid var(--primary);
      color: var(--primary);
      padding: 0.5rem 0.9rem;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }

    .test-route-btn:hover { background: rgba(139, 92, 246, 0.25); }
    .test-route-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .sim-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .sim-card.viable { border-color: rgba(16, 185, 129, 0.4); }
    .sim-card.failed { border-color: rgba(239, 68, 68, 0.3); }
  </style>
</head>
<body>

  <header>
    <div class="brand-section">
      <div class="logo-mark"></div>
      <h1>Fiber Route Diagnostics</h1>
    </div>
    <div class="status-badge">
      <span class="status-dot" id="ws-dot"></span>
      <span id="ws-status-text">Disconnected</span>
    </div>
  </header>

  <div class="dashboard-layout">
    <!-- Left Feed Column -->
    <div class="feed-panel">
      <div class="search-bar-container">
        <input type="text" class="search-input" id="search-bar" placeholder="Search by payment hash...">
      </div>
      <div class="test-route-bar">
        <input type="text" class="test-route-input" id="test-route-input" placeholder="Paste invoice to test route...">
        <div class="test-route-actions">
          <button class="test-route-btn" id="test-route-btn" onclick="runDryRun()" style="flex:1;">Test Route</button>
          <button class="test-route-btn" id="probe-btn" onclick="runProbe()" style="flex:1;border-color:var(--pending);color:var(--pending);background:var(--pending-glow);">Probe</button>
        </div>
      </div>
      <div class="payments-list" id="payments-list">
        <!-- Rendered dynamically -->
      </div>
    </div>

    <!-- Right Detail Column -->
    <div class="details-panel" id="details-panel">
      <!-- Statistics panel — always visible -->
      <div class="stats-panel" id="stats-panel">
        <div class="stats-panel-header">
          <div class="section-title" style="margin-bottom:0;">Network Health Overview</div>
        </div>
        <div class="stats-grid" id="stats-grid">
          <!-- Rendered by renderStatsPanel() -->
          <div class="stat-card"><div class="stat-label">Total</div><div class="stat-value muted">—</div></div>
          <div class="stat-card"><div class="stat-label">Success Rate</div><div class="stat-value muted">—</div></div>
          <div class="stat-card"><div class="stat-label">Failure Rate</div><div class="stat-value muted">—</div></div>
          <div class="stat-card"><div class="stat-label">Succeeded</div><div class="stat-value muted">—</div></div>
          <div class="stat-card"><div class="stat-label">Failed</div><div class="stat-value muted">—</div></div>
          <div class="stat-card"><div class="stat-label">Avg Fee</div><div class="stat-value muted">—</div></div>
        </div>
        <div id="error-codes-section" style="display:none;">
          <div class="stat-label" style="margin-bottom:0.4rem;">Top Error Codes</div>
          <div class="error-codes-list" id="error-codes-list"></div>
        </div>
      </div>

      <div id="payment-detail-view">
        <div class="placeholder-view">
          <span class="placeholder-icon">🔍</span>
          <p>Select a payment from the list to view route diagnostics.</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    let ws;
    let paymentsMap = new Map();
    let activePaymentHash = null;
    let globalStats = null;
    let nodeAliases = {};

    function resolveAlias(pubkey) {
      if (nodeAliases[pubkey]) return nodeAliases[pubkey];
      return pubkey.length > 12 ? pubkey.slice(0, 8) + '…' : pubkey;
    }

    function renderStatsPanel() {
      if (!globalStats) return;
      const s = globalStats;
      const pct = v => (v * 100).toFixed(1) + '%';
      document.getElementById('stats-grid').innerHTML = `
        <div class="stat-card"><div class="stat-label">Total</div><div class="stat-value muted">${s.total}</div></div>
        <div class="stat-card"><div class="stat-label">Success Rate</div><div class="stat-value success">${pct(s.successRate)}</div></div>
        <div class="stat-card"><div class="stat-label">Failure Rate</div><div class="stat-value ${s.failureRate > 0 ? 'error' : 'muted'}">${pct(s.failureRate)}</div></div>
        <div class="stat-card"><div class="stat-label">Succeeded</div><div class="stat-value success">${s.succeeded}</div></div>
        <div class="stat-card"><div class="stat-label">Failed</div><div class="stat-value ${s.failed > 0 ? 'error' : 'muted'}">${s.failed}</div></div>
        <div class="stat-card"><div class="stat-label">Avg Fee</div><div class="stat-value muted">${s.avgFeeCkb ? s.avgFeeCkb.toFixed(6) + ' CKB' : '—'}</div></div>
      `;
      const errSection = document.getElementById('error-codes-section');
      if (s.topErrorCodes && s.topErrorCodes.length > 0) {
        errSection.style.display = '';
        document.getElementById('error-codes-list').innerHTML = s.topErrorCodes
          .slice(0, 6)
          .map(e => `<span class="error-badge">${e.code}<span class="error-badge-count">×${e.count}</span></span>`)
          .join('');
      } else {
        errSection.style.display = 'none';
      }
    }

    async function fetchAndRenderStats() {
      try {
        const res = await fetch('/api/stats');
        if (res.ok) { globalStats = await res.json(); renderStatsPanel(); }
      } catch (e) { /* proxy not running — stats stay blank */ }
    }

    async function fetchNodeAliases() {
      try {
        const res = await fetch('/api/nodes');
        if (res.ok) { nodeAliases = await res.json(); }
      } catch (e) { /* aliases stay empty — raw pubkeys shown */ }
    }

    async function runDryRun() {
      const invoice = document.getElementById('test-route-input').value.trim();
      if (!invoice) return;
      const btn = document.getElementById('test-route-btn');
      btn.disabled = true;
      btn.textContent = 'Testing…';

      // Show result in the detail view
      const detailsEl = document.getElementById('payment-detail-view');
      detailsEl.innerHTML = `<div style="color:var(--text-muted);padding:2rem;text-align:center;font-size:0.875rem;">Simulating route…</div>`;

      try {
        const res = await fetch('/api/payments/dry-run', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ invoice })
        });
        const data = await res.json();
        renderSimResult(data, invoice);
      } catch (e) {
        detailsEl.innerHTML = `<div style="color:var(--error);padding:2rem;">Could not reach proxy server.</div>`;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Test Route';
      }
    }

    async function runProbe() {
      const invoice = document.getElementById('test-route-input').value.trim();
      if (!invoice) return;
      const btn = document.getElementById('probe-btn');
      btn.disabled = true;
      btn.textContent = 'Probing…';

      const detailsEl = document.getElementById('payment-detail-view');
      detailsEl.innerHTML = `<div style="color:var(--text-muted);padding:2rem;text-align:center;font-size:0.875rem;">Sending probe payment…</div>`;

      try {
        const res = await fetch('/api/payments/probe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ invoice })
        });
        const data = await res.json();
        renderProbeResult(data, invoice);
      } catch (e) {
        detailsEl.innerHTML = `<div style="color:var(--error);padding:2rem;">Could not reach proxy server.</div>`;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Probe';
      }
    }

    function renderProbeResult(data, invoice) {
      const detailsEl = document.getElementById('payment-detail-view');
      const cls = data.classification;
      const viable = data.viable;
      const statusColor = viable ? 'var(--success)' : cls === 'UNKNOWN' ? 'var(--pending)' : 'var(--error)';
      const statusLabel = cls === 'ROUTE_VIABLE' ? 'ROUTE VIABLE' : cls === 'ROUTE_BLOCKED' ? 'ROUTE BLOCKED' : 'UNKNOWN';

      let html = `
        <div class="sim-card ${viable ? 'viable' : 'failed'}">
          <div style="display:flex;align-items:center;gap:0.75rem;">
            <span style="font-size:1rem;font-weight:800;color:${statusColor};">${statusLabel}</span>
            <span style="font-size:0.75rem;color:var(--text-muted);">Probe Result · ${data.latencyMs}ms</span>
          </div>
          <div class="invoice-console">${invoice}</div>
      `;

      if (!viable && data.errorMessage) {
        html += `
          <div>
            <div class="stat-label" style="margin-bottom:0.4rem;">Error</div>
            <div class="raw-error-console">${data.errorMessage}</div>
          </div>
        `;
      }

      if (viable) {
        html += `<div style="font-size:0.875rem;color:var(--success);">Route reached the destination. The recipient rejected the probe hash as expected — the path is clear.</div>`;
      }

      html += `</div>`;
      detailsEl.innerHTML = html;
    }

    function renderSimResult(data, invoice) {
      const detailsEl = document.getElementById('payment-detail-view');
      const viable = data.success === true;
      const statusColor = viable ? 'var(--success)' : 'var(--error)';
      const statusLabel = viable ? 'ROUTE VIABLE' : 'ROUTE BLOCKED';

      let html = `
        <div class="sim-card ${viable ? 'viable' : 'failed'}">
          <div style="display:flex;align-items:center;gap:0.75rem;">
            <span style="font-size:1rem;font-weight:800;color:${statusColor};">${statusLabel}</span>
            <span style="font-size:0.75rem;color:var(--text-muted);">Route Simulation</span>
          </div>
          <div class="invoice-console">${invoice}</div>
      `;

      if (!viable && data.diagnostic) {
        const d = data.diagnostic;
        html += `
          <div class="diagnostic-card">
            <div class="diag-title-section">
              <span class="warning-icon">⚠️</span>
              <span class="diag-code">DIAGNOSTIC_ERR: ${d.code || 'Unknown'}</span>
            </div>
            <div class="diag-suggestion">${d.suggestion || ''}</div>
          </div>
        `;
      }

      if (!viable && data.error && !data.diagnostic) {
        html += `<div class="raw-error-console">${data.error}</div>`;
      }

      html += `</div>`;
      detailsEl.innerHTML = html;
    }

    function formatTime(timestamp) {
      return new Date(timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    async function loadStaticHistory() {
      try {
        const response = await fetch("history.json");
        if (response.ok) {
          const history = await response.json();
          paymentsMap.clear();
          history.forEach(p => paymentsMap.set(p.payment_hash, p));
          renderPaymentsList();
          console.log("[Fallback] Static transaction history loaded successfully.");
        }
      } catch (err) {
        console.warn("[Fallback] Failed to load history.json (this is normal when running server-only):", err.message);
      }
    }

    function initWebSocket() {
      const wsUrl = `ws://${window.location.host}`;
      console.log("[WS] Connecting to:", wsUrl);
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        document.getElementById("ws-dot").classList.add("connected");
        document.getElementById("ws-status-text").innerText = "Connected";
        console.log("[WS] Connected successfully.");
      };

      ws.onclose = () => {
        document.getElementById("ws-dot").classList.remove("connected");
        document.getElementById("ws-status-text").innerText = "Disconnected";
        console.warn("[WS] Connection lost. Reconnecting in 3s...");
        setTimeout(initWebSocket, 3000);
      };

      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === "PAYMENT_HISTORY") {
            paymentsMap.clear();
            msg.payload.forEach(p => paymentsMap.set(p.payment_hash, p));
            renderPaymentsList();
            fetchAndRenderStats();
            fetchNodeAliases();
          } else if (msg.type === "PAYMENT_UPDATE") {
            const p = msg.payload;
            paymentsMap.set(p.payment_hash, p);
            renderPaymentsList();
            if (activePaymentHash === p.payment_hash) {
              renderDetails(p.payment_hash);
            }
          } else if (msg.type === "STATS_UPDATE") {
            globalStats = msg.payload;
            renderStatsPanel();
          } else if (msg.type === "NODE_ALIASES_UPDATED") {
            nodeAliases = msg.payload || {};
            // Re-render active payment detail so hop labels update immediately
            if (activePaymentHash) renderDetails(activePaymentHash);
          }
        } catch (err) {
          console.error("[WS] Failed to parse message:", err);
        }
      };
    }

    function renderPaymentsList() {
      const listEl = document.getElementById("payments-list");
      const filterQuery = document.getElementById("search-bar").value.toLowerCase().trim();
      
      const payments = Array.from(paymentsMap.values())
        .filter(p => !filterQuery || p.payment_hash.toLowerCase().includes(filterQuery))
        .sort((a, b) => b.created_at - a.created_at);

      if (payments.length === 0) {
        listEl.innerHTML = '<div style="color: var(--text-muted); text-align: center; margin-top: 2rem; font-size: 0.875rem;">No payment records found.</div>';
        return;
      }

      listEl.innerHTML = payments.map(p => `
        <div class="payment-card ${activePaymentHash === p.payment_hash ? 'active' : ''}" onclick="selectPayment('${p.payment_hash}')">
          <div class="card-header">
            <span class="amount-text">${p.amount_ckb.toFixed(2)} CKB</span>
            <span class="status-pill ${p.status.toLowerCase()}">${p.status}</span>
          </div>
          <div class="hash-text">${p.payment_hash}</div>
          <div class="timestamp-text">${formatTime(p.created_at)}</div>
        </div>
      `).join("");
    }

    function selectPayment(hash) {
      activePaymentHash = hash;
      renderPaymentsList();
      renderDetails(hash);
    }

    function renderDetails(hash) {
      const p = paymentsMap.get(hash);
      const detailsEl = document.getElementById("payment-detail-view");

      if (!p) {
        detailsEl.innerHTML = `
          <div class="placeholder-view">
            <span class="placeholder-icon">🔍</span>
            <p>Select a payment from the list to view route diagnostics.</p>
          </div>
        `;
        return;
      }

      // Render summary info
      let detailsHtml = `
        <div>
          <h2 style="font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 0.5rem;">Payment Log</h2>
          <div class="hash-text" style="font-size: 0.875rem;">${p.payment_hash}</div>
        </div>

        <div class="summary-grid">
          <div class="summary-card">
            <div class="section-title">Amount Sent</div>
            <div class="summary-val">${p.amount_ckb.toFixed(2)} CKB</div>
          </div>
          <div class="summary-card">
            <div class="section-title">Status</div>
            <div class="summary-val" style="color: var(--${p.status.toLowerCase()});">${p.status}</div>
          </div>
          <div class="summary-card">
            <div class="section-title">Routing Fee</div>
            <div class="summary-val">${p.fee_ckb ? p.fee_ckb.toFixed(8) + ' CKB' : '--'}</div>
          </div>
        </div>
      `;

      // Render routing graph hops
      if (p.hops && p.hops.length > 0) {
        detailsHtml += `
          <div class="route-visualizer">
            <div class="section-title" style="margin-bottom: 0;">Multi-Hop Routing Path</div>
            <div class="hops-chain">
              ${p.hops.map((hop, i) => {
                const alias = resolveAlias(hop.node_pubkey);
                const label = i === 0 ? 'Payer' : (i === p.hops.length - 1 ? 'Recipient' : 'Hop ' + i);
                const showAlias = alias !== hop.node_pubkey && alias !== label;
                return `
                <div class="hop-node ${hop.status.toLowerCase()}">
                  <div class="node-circle" title="${hop.node_pubkey}">${showAlias ? alias : label}</div>
                  <div class="node-pubkey">${hop.node_pubkey.length > 12 ? hop.node_pubkey.slice(0, 10) + '…' : hop.node_pubkey}</div>
                </div>`;
              }).join("")}
            </div>
          </div>
        `;
      }

      // Render Diagnostics warning if failed
      if (p.status === "Failed") {
        detailsHtml += `
          <div class="diagnostic-card">
            <div class="diag-title-section">
              <span class="warning-icon">⚠️</span>
              <span class="diag-code">DIAGNOSTIC_ERR: ${p.error_code || 'Unknown'}</span>
            </div>
            <div class="diag-suggestion">
              ${p.diagnostic_msg || 'No diagnostic message available for this error.'}
            </div>
          </div>
        `;
      }

      // Render raw error console logs
      detailsHtml += `
        <div class="logs-card">
          <div class="section-title">Developer Console & Invoice Logs</div>
          <div style="font-size: 0.8125rem; font-weight: 600; margin-bottom: 0.25rem;">Invoice Address:</div>
          <div class="invoice-console">${p.invoice_address}</div>
          <button class="copy-btn" onclick="navigator.clipboard.writeText('${p.invoice_address}')">Copy Invoice</button>

          ${p.status === "Failed" && p.error_raw ? `
            <div style="font-size: 0.8125rem; font-weight: 600; margin-top: 1rem; margin-bottom: 0.25rem;">Raw FNN Node Error Message:</div>
            <div class="raw-error-console">${p.error_raw}</div>
          ` : ''}
        </div>
      `;

      detailsEl.innerHTML = detailsHtml;
    }


    document.getElementById("search-bar").addEventListener("input", renderPaymentsList);

    // Bootstrap
    loadStaticHistory();
    initWebSocket();
  </script>
</body>
</html>
